version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: apiverse_postgres
    environment:
      POSTGRES_USER: apiverse_user
      POSTGRES_PASSWORD: apiverse_pass
      POSTGRES_DB: apiverse_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiverse_user -d apiverse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apiverse_redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../
      dockerfile: infra/Dockerfile.api
    container_name: apiverse_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://apiverse_user:apiverse_pass@postgres:5432/apiverse_db
      REDIS_URL: redis://redis:6379/0
      VAULT_MASTER_KEY_HEX: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_SECRET: super-secret-apiverse-jwt-token-key-32chars
    ports:
      - "8000:8000"

  web:
    build:
      context: ../
      dockerfile: infra/Dockerfile.web
    container_name: apiverse_web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/ws_solar_alpha
    ports:
      - "3000:3000"

volumes:
  pgdata:
